; Athena's desk orb - ESP32 firmware.
;   pio run -t upload        (ESP32 on USB)
;   pio device monitor       (what it is doing)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    tzapu/WiFiManager@^2.0.17
    fastled/FastLED@^3.9.0
    bblanchon/ArduinoJson@^7.2.0
board_build.partitions = huge_app.csv   ; Wi-Fi setup page + HTTP need more than the default 1.3 MB
